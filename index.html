    function playTTS(text) {
      if (!window.speechSynthesis) {
        alert("이 브라우저는 음성 합성(TTS)을 지원하지 않습니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const clean = text.replace(/[*_~`]/g, '');
      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel')));
      if (enVoice) utterance.voice = enVoice;
      
      window.speechSynthesis.speak(utterance);
    }

    // Helper: Play chime audio via Web Audio API
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.85);
      } catch (e) {}
    }

    // --- TAB 1: SPEAKING & AI FEEDBACK ---
    function SpeakingTab({ settings, onSaveCards, onSessionComplete, showToast, openSettings }) {
      // Step 1: Selected Topic State
      const [selectedCategory, setSelectedCategory] = useState("전체");
      const [currentTopic, setCurrentTopic] = useState(() => PRESET_TOPICS[0]);
      const [isCustomTopic, setIsCustomTopic] = useState(false);
      const [customTopicInput, setCustomTopicInput] = useState("");

      // Step 2: Speaking & STT State
      const [isRecording, setIsRecording] = useState(false);
      const [timeLeft, setTimeLeft] = useState(60); // 60s countdown
      const [transcript, setTranscript] = useState("");
      const [interimText, setInterimText] = useState("");
      const [isSTTSupported, setIsSTTSupported] = useState(true);
      const [micVolume, setMicVolume] = useState(0); // for visualizer

      // Step 3: AI Feedback Pipeline State
      const [isLoadingAI, setIsLoadingAI] = useState(false);
      const [feedbackData, setFeedbackData] = useState(null);
      const [savedVocabIds, setSavedVocabIds] = useState(new Set());

      // Audio & Speech Recognition Refs
      const recognitionRef = useRef(null);
      const timerIntervalRef = useRef(null);
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const streamRef = useRef(null);
      const animFrameRef = useRef(null);

      // Filtered Topics
      const availableTopics = useMemo(() => {
        if (selectedCategory === "전체") return PRESET_TOPICS;
        return PRESET_TOPICS.filter(t => t.category === selectedCategory);
      }, [selectedCategory]);

      // Random topic generator with animation
      const pickRandomTopic = () => {
        const pool = availableTopics;
        const next = pool[Math.floor(Math.random() * pool.length)];
        setCurrentTopic(next);
        setIsCustomTopic(false);
      };

      // Check STT support on mount
      useEffect(() => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          setIsSTTSupported(false);
        }
      }, []);

      // Start Microphone & Real-time Web Audio Visualizer
      const startMicrophoneAudio = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          streamRef.current = stream;
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioContext();
          audioCtxRef.current = audioCtx;
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          analyserRef.current = analyser;
          const source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);

          const dataArray = new Uint8Array(analyser.frequencyBinCount);
          const updateVolume = () => {
            if (!analyserRef.current) return;
            analyserRef.current.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
              sum += dataArray[i];
            }
            const avg = sum / dataArray.length;
            setMicVolume(Math.min(100, Math.round(avg * 1.5)));
            animFrameRef.current = requestAnimationFrame(updateVolume);
          };
          updateVolume();
        } catch (err) {
          console.warn("Microphone access for visualizer failed:", err);
        }
      };

      const stopMicrophoneAudio = () => {
        if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
        }
        if (audioCtxRef.current && audioCtxRef.current.state !== 'closed') {
          audioCtxRef.current.close();
        }
        setMicVolume(0);
      };

      // Start 60-Second Speaking & STT Session
      const startRecording = () => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert("이 브라우저는 음성 인식(STT)을 지원하지 않습니다. 텍스트 박스에 직접 타이핑해주세요!");
          return;
        }

        setTranscript("");
        setInterimText("");
        setTimeLeft(60);
        setIsRecording(true);
        setFeedbackData(null);
        setSavedVocabIds(new Set());

        startMicrophoneAudio();

        try {
          const rec = new SpeechRec();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = 'en-US';

          rec.onresult = (event) => {
            let interim = '';
            let final = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const text = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                final += text + ' ';
              } else {
                interim += text;
              }
            }
            if (final) {
              setTranscript(prev => (prev + ' ' + final).trim());
            }
            setInterimText(interim);
          };

          rec.onerror = (e) => {
            console.error("STT Error:", e);
            if (e.error === 'not-allowed') {
              showToast("마이크 권한이 허용되지 않았습니다. 브라우저 설정에서 마이크를 허용해주세요.", "error");
            }
          };

          rec.onend = () => {
            // Keep active if user still has time
            if (isRecording && timeLeft > 0) {
              try { rec.start(); } catch {}
            }
          };

          rec.start();
          recognitionRef.current = rec;
        } catch (e) {
          console.error("Failed to start SpeechRecognition", e);
        }

        // Start Countdown Timer
        clearInterval(timerIntervalRef.current);
        timerIntervalRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              stopRecording();
              playChime();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
      };

      // Stop Recording & Prepare for Editing
      const stopRecording = () => {
        setIsRecording(false);
        clearInterval(timerIntervalRef.current);
        if (recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch {}
        }
        stopMicrophoneAudio();
        setInterimText("");
      };

      // Clean up on unmount
      useEffect(() => {
        return () => {
          clearInterval(timerIntervalRef.current);
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch {}
          }
          stopMicrophoneAudio();
        };
      }, []);

      // Reset everything to start over
      const resetSession = () => {
        stopRecording();
        setTimeLeft(60);
        setTranscript("");
        setInterimText("");
        setFeedbackData(null);
      };

      // Execute AI 3-Step Feedback Pipeline
      const requestAIFeedback = async () => {
        const fullText = (transcript + " " + interimText).trim();
        if (!fullText) {
          showToast("녹음된 내용이나 입력한 텍스트가 없습니다. 먼저 자유롭게 말하거나 타이핑해주세요!", "warning");
          return;
        }

        setIsLoadingAI(true);
        const topicQuestion = isCustomTopic ? customTopicInput : currentTopic.question;

        try {
          if (settings.provider === 'demo' || (!settings.geminiKey && !settings.openaiKey)) {
            // Use realistic mock data
            await new Promise(r => setTimeout(r, 1400));
            // Personalize mock response based on text keywords
            const mock = { ...MOCK_FEEDBACKS[0] };
            if (fullText.includes("meeting") || fullText.includes("회의") || fullText.includes("cancel")) {
              mock.intent_summary = "갑작스러운 일정 변동이나 회의 취소로 당혹스러웠던 상황을 전달하고자 함.";
            } else if (fullText.includes("invest") || fullText.includes("stock") || fullText.includes("주식")) {
              mock.intent_summary = "최근 관심 있는 주식이나 경제 흐름에 대해 조심스럽게 투자 의견을 표현하고자 함.";
              mock.casual_rewriting = "I've been keeping a close eye on the recent tech stocks lately, but market volatility has kept me on the sidelines.";
              mock.business_rewriting = "Given the current macroeconomic volatility, I am maintaining a cautious stance while monitoring tech sector valuations.";
            }
            setFeedbackData(mock);
            onSessionComplete({
              id: 'session-' + Date.now(),
              date: new Date().toISOString(),
              topic: topicQuestion,
              category: currentTopic.category,
              rawText: fullText,
              feedback: mock
            });
            showToast("첨삭이 완료되었습니다! (데모 모드)", "success");
          } else if (settings.provider === 'gemini') {
            // Call Google Gemini API
            const res = await callGeminiAPI(settings.geminiKey, topicQuestion, fullText);
            setFeedbackData(res);
            onSessionComplete({
              id: 'session-' + Date.now(),
              date: new Date().toISOString(),
              topic: topicQuestion,
              category: currentTopic.category,
              rawText: fullText,
              feedback: res
            });
            showToast("Gemini 3단계 심층 첨삭이 완료되었습니다!", "success");

            // Call OpenAI API
            const res = await callOpenAIAPI(settings.openaiKey, topicQuestion, fullText);
            setFeedbackData(res);
            onSessionComplete({
              id: 'session-' + Date.now(),
              date: new Date().toISOString(),
              topic: topicQuestion,
              category: currentTopic.category,
              rawText: fullText,
              feedback: res
            });
            showToast("OpenAI 심층 첨삭이 완료되었습니다!", "success");

        } finally {

`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",

            }
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `HTTP ${res.status}`);

        const data = await res.json();
        const rawJsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;

주제: ${topic}
사용자의 발화 원문:
"""
${rawSpeech}
"""

반드시 다음 JSON 키를 가진 JSON 객체로 응답하세요:
{
  "intent_summary": "한국어 의도 요약",

          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            response_format: { type: "json_object" },
            temperature: 0.3,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userPrompt }
            ]
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        return JSON.parse(data.choices[0].message.content);

    // --- TAB 2: FLASHCARDS & INTERACTIVE QUIZ MODE ---
    function FlashcardsTab({ flashcards, setFlashcards, showToast }) {
      // View Mode: 'flip' | 'quiz' | 'list'
      const [viewMode, setViewMode] = useState('flip');
      
      // Filter: 'all' | 'need_review' | 'memorized'
      const [filter, setFilter] = useState('all');

      // Card Flip State
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // Quiz Mode State
      const [userQuizAnswer, setUserQuizAnswer] = useState("");
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [quizIsCorrect, setQuizIsCorrect] = useState(null);
      const [showHint, setShowHint] = useState(false);

      // Filtered Card List
      const filteredCards = useMemo(() => {
        if (filter === 'need_review') return flashcards.filter(c => !c.memorized);
        if (filter === 'memorized') return flashcards.filter(c => c.memorized);
        return flashcards;
      }, [flashcards, filter]);

      const currentCard = filteredCards[currentIndex];

      // Next / Prev Card Handlers
      const handleNext = () => {
        setIsFlipped(false);
        setUserQuizAnswer("");
        setQuizSubmitted(false);
        setQuizIsCorrect(null);
        setShowHint(false);
        if (currentIndex < filteredCards.length - 1) {
          setCurrentIndex(i => i + 1);
        } else {
          setCurrentIndex(0);
        }
      };

      const handlePrev = () => {
        setIsFlipped(false);
        setUserQuizAnswer("");
        setQuizSubmitted(false);
        setQuizIsCorrect(null);
        setShowHint(false);
        if (currentIndex > 0) {
          setCurrentIndex(i => i - 1);
        } else {
          setCurrentIndex(filteredCards.length - 1);
        }
      };

      // Toggle Memorized Status
      const toggleMemorized = (cardId) => {
        setFlashcards(prev => prev.map(c => {
          if (c.id === cardId) {
            const nextVal = !c.memorized;
            showToast(nextVal ? "외운 단어로 분류되었습니다! 🎉" : "다시 볼 단어로 변경되었습니다.", "info");
            return { ...c, memorized: nextVal };
          }
          return c;
        }));
      };

      // Delete Card
      const deleteCard = (cardId) => {
        if (!confirm("이 카드를 단어장에서 삭제할까요?")) return;
        setFlashcards(prev => prev.filter(c => c.id !== cardId));
        showToast("카드가 삭제되었습니다.", "info");
      };

      // Quiz Answer Verification
      const handleQuizSubmit = (e) => {
        e?.preventDefault();
        if (!currentCard || !userQuizAnswer.trim()) return;

        const cleanUser = userQuizAnswer.trim().toLowerCase().replace(/[.,!?'"~]/g, '');
        const cleanTarget = currentCard.back.trim().toLowerCase().replace(/[.,!?'"~]/g, '');

        // Simple fuzzy match
        const isMatch = cleanUser === cleanTarget || cleanTarget.includes(cleanUser) || cleanUser.includes(cleanTarget);
        setQuizIsCorrect(isMatch);
        setQuizSubmitted(true);

        if (isMatch) {
          showToast("정답입니다! 완벽해요! 👏", "success");
          // auto mark memorized
          setFlashcards(prev => prev.map(c => c.id === currentCard.id ? { ...c, memorized: true } : c));
        }
      };

      return (
        <div className="space-y-6">
          {/* Top Control Bar */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 md:p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-slate-500 dark:text-slate-400">단어 통계:</span>
              <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                총 {flashcards.length}개
              </span>
              <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-400">
                외웠어요 {flashcards.filter(c => c.memorized).length}
              </span>
              <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-400">
                복습 필요 {flashcards.filter(c => !c.memorized).length}
              </span>
            </div>

            {/* Mode & Filter Tabs */}
            <div className="flex flex-wrap items-center gap-2">
              {/* Filter */}
              <div className="inline-flex p-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs">
                <button
                  onClick={() => { setFilter('all'); setCurrentIndex(0); }}
                  className={`px-2.5 py-1 rounded-md transition-colors ${filter === 'all' ? 'bg-white dark:bg-slate-700 font-semibold shadow-sm' : 'text-slate-500'}`}
                >
                  전체
                </button>
                <button
                  onClick={() => { setFilter('need_review'); setCurrentIndex(0); }}
                  className={`px-2.5 py-1 rounded-md transition-colors ${filter === 'need_review' ? 'bg-white dark:bg-slate-700 font-semibold shadow-sm text-amber-600' : 'text-slate-500'}`}
                >
                  다시보기
                </button>
                <button
                  onClick={() => { setFilter('memorized'); setCurrentIndex(0); }}
                  className={`px-2.5 py-1 rounded-md transition-colors ${filter === 'memorized' ? 'bg-white dark:bg-slate-700 font-semibold shadow-sm text-emerald-600' : 'text-slate-500'}`}
                >
                  외운 표현
                </button>
              </div>

              {/* View Mode Toggle */}
              <div className="inline-flex p-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs font-semibold">
                <button
                  onClick={() => setViewMode('flip')}
                  className={`px-3 py-1 rounded-md transition-all ${viewMode === 'flip' ? 'bg-brand-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400'}`}
                >
                  🃏 3D 플립 카드
                </button>
                <button
                  onClick={() => setViewMode('quiz')}
                  className={`px-3 py-1 rounded-md transition-all ${viewMode === 'quiz' ? 'bg-brand-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400'}`}
                >
                  ✍️ 영작 퀴즈
                </button>
                <button
                  onClick={() => setViewMode('list')}
                  className={`px-3 py-1 rounded-md transition-all ${viewMode === 'list' ? 'bg-brand-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400'}`}
                >
                  📋 목록 뷰
                </button>
              </div>
            </div>
          </div>

          {/* EMPTY STATE */}
          {filteredCards.length === 0 && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl p-12 text-center border border-slate-200/80 dark:border-slate-800 space-y-3">
              <div className="w-12 h-12 mx-auto rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400">
                <Icon name="bookOpen" />
              </div>
              <h3 className="text-base font-bold text-slate-800 dark:text-white">
                저장된 카드가 없습니다
              </h3>
              <p className="text-xs text-slate-500 max-w-sm mx-auto">
                스피킹 세션을 완료한 후 AI 첨삭 리포트에서 <b>[+ 단어장 저장]</b> 버튼을 눌러 나만의 표현을 모아보세요.
              </p>
            </div>
          )}

          {/* MODE 1: 3D FLIP CARD */}
          {filteredCards.length > 0 && viewMode === 'flip' && currentCard && (
            <div className="space-y-4 max-w-xl mx-auto">
              <div className="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 px-1">
                <span>카드 {currentIndex + 1} / {filteredCards.length}</span>
                <span>카드를 클릭하면 앞/뒤가 뒤집힙니다</span>
              </div>

              {/* 3D Perspective Container */}
              <div
                onClick={() => setIsFlipped(!isFlipped)}
                className="perspective-1000 w-full h-72 cursor-pointer select-none"
              >
                <div className={`relative w-full h-full rounded-2xl transition-transform duration-500 transform-style-preserve-3d shadow-lg border border-slate-200/80 dark:border-slate-800 ${
                  isFlipped ? 'rotate-y-180' : ''
                }`}>
                  {/* FRONT: Korean Intent & Situation */}
                  <div className="absolute inset-0 w-full h-full rounded-2xl p-6 bg-gradient-to-br from-white to-slate-50 dark:from-slate-900 dark:to-slate-850 flex flex-col justify-between backface-hidden">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700 dark:bg-brand-950/60 dark:text-brand-300">
                        {currentCard.category || "직장인 영어"}
                      </span>
                      <span className="text-xs text-slate-400 font-medium">앞면 (한국어 의도)</span>
                    </div>

                    <div className="text-center my-auto space-y-2">
                      <p className="text-xs text-brand-600 dark:text-brand-400 font-medium">이 말을 영어로 어떻게 할까요?</p>
                      <h3 className="text-base md:text-xl font-bold text-slate-900 dark:text-white leading-relaxed">
                        "{currentCard.front}"
                      </h3>
                    </div>

                    <div className="text-center text-xs text-slate-400">
                      클릭해서 영어 표현 확인하기 👆
                    </div>
                  </div>

                  {/* BACK: English Expression & Example */}
                  <div className="absolute inset-0 w-full h-full rounded-2xl p-6 bg-gradient-to-br from-indigo-50/80 to-brand-50/40 dark:from-slate-900 dark:to-indigo-950/30 flex flex-col justify-between backface-hidden rotate-y-180 border-2 border-brand-500/30">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-brand-500 text-white">
                        원어민 영어 표현
                      </span>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          playTTS(currentCard.back);
                        }}
                        className="flex items-center gap-1 text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline"
                        title="발음 듣기"
                      >
                        <Icon name="volume2" />
                        <span>발음 듣기</span>
                      </button>
                    </div>

                    <div className="text-center my-auto space-y-3">
                      <h3 className="text-lg md:text-2xl font-bold text-brand-600 dark:text-brand-400 tracking-tight">
                        "{currentCard.back}"
                      </h3>
                      {currentCard.example && (
                        <p className="text-xs md:text-sm text-slate-600 dark:text-slate-300 italic bg-white/60 dark:bg-slate-800/60 p-2.5 rounded-xl border border-brand-200/50 dark:border-brand-900/40">
                          {currentCard.example}
                        </p>
                      )}
                    </div>

                    <div className="text-center text-xs text-slate-400">
                      다시 클릭하면 앞면으로 뒤집힙니다
                    </div>
                  </div>
                </div>
              </div>

              {/* Bottom Actions: Status Toggle & Next/Prev */}
              <div className="flex items-center justify-between gap-3 pt-2">
                <button
                  onClick={handlePrev}
                  className="flex items-center gap-1 px-4 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 transition-colors"
                >
                  <Icon name="chevronLeft" />
                  <span>이전</span>
                </button>

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => toggleMemorized(currentCard.id)}
                    className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold transition-all ${
                      currentCard.memorized
                        ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/20'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                    }`}
                  >
                    <Icon name="check" />
                    <span>{currentCard.memorized ? "외웠어요! ✅" : "다 외웠나요?"}</span>
                  </button>

                  <button
                    onClick={() => deleteCard(currentCard.id)}
                    className="p-2 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors"
                    title="카드 삭제"
                  >
                    <Icon name="trash" />
                  </button>
                </div>

                <button
                  onClick={handleNext}
                  className="flex items-center gap-1 px-4 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 transition-colors"
                >
                  <span>다음</span>
                  <Icon name="chevronRight" />
                </button>
              </div>
            </div>
          )}

          {/* MODE 2: INTERACTIVE QUIZ MODE */}
          {filteredCards.length > 0 && viewMode === 'quiz' && currentCard && (
            <div className="max-w-xl mx-auto bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-5">
              <div className="flex items-center justify-between text-xs text-slate-500">
                <span className="font-semibold text-brand-600 dark:text-brand-400">
                  ✍️ 영작 / 빈칸 퀴즈 ({currentIndex + 1}/{filteredCards.length})
                </span>
                <button
                  onClick={() => setShowHint(!showHint)}
                  className="flex items-center gap-1 text-amber-600 hover:underline"
                >
                  <Icon name="helpCircle" />
                  <span>{showHint ? "힌트 숨기기" : "힌트 보기"}</span>
                </button>
              </div>

              {/* Quiz Prompt */}
              <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 space-y-2 text-center">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                  다음 한국어 상황에 맞는 원어민 표현을 입력하세요
                </span>
                <h3 className="text-base md:text-lg font-bold text-slate-900 dark:text-white">
                  "{currentCard.front}"
                </h3>

                {showHint && (
                  <div className="text-xs font-mono text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/40 p-2 rounded-lg mt-2">
                    💡 힌트: {currentCard.back.split(' ').map(w => w[0] + '_'.repeat(Math.max(1, w.length - 1))).join(' ')}
                  </div>
                )}
              </div>

              {/* Quiz Input Form */}
              <form onSubmit={handleQuizSubmit} className="space-y-3">
                <div className="relative">
                  <input
                    type="text"
                    value={userQuizAnswer}
                    onChange={(e) => setUserQuizAnswer(e.target.value)}
                    placeholder="원어민 영어 표현을 직접 타이핑해보세요..."
                    className="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                    autoFocus
                  />
                  {quizSubmitted && (
                    <div className="absolute right-3 top-3">
                      {quizIsCorrect ? (
                        <span className="text-emerald-500 font-bold text-sm">✅ 정답!</span>
                      ) : (
                        <span className="text-rose-500 font-bold text-sm">❌ 아쉬워요</span>
                      )}
                    </div>
                  )}
                </div>

                {/* Submitted Evaluation Card */}
                {quizSubmitted && (
                  <div className={`p-4 rounded-xl text-xs space-y-2 border ${
                    quizIsCorrect 
                      ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200'
                      : 'bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-200'
                  }`}>
                    <div className="flex items-center justify-between">
                      <span className="font-bold">
                        {quizIsCorrect ? "축하합니다! 완벽히 일치합니다." : "정답 표현을 확인하고 소리 내어 읽어보세요:"}
                      </span>
                      <button
                        type="button"
                        onClick={() => playTTS(currentCard.back)}
                        className="flex items-center gap-1 font-semibold hover:underline"
                      >
                        <Icon name="volume2" />
                        <span>발음 듣기</span>
                      </button>
                    </div>

                    <div className="text-sm font-bold font-mono">
                      정답: "{currentCard.back}"
                    </div>
                    {currentCard.example && (
                      <div className="text-[11px] opacity-90 italic">
                        예문: {currentCard.example}
                      </div>
                    )}
                  </div>
                )}

                <div className="flex items-center justify-between gap-3 pt-2">
                  <button
                    type="button"
                    onClick={handlePrev}
                    className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300"
                  >
                    이전 문제
                  </button>

                  <div className="flex items-center gap-2">
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs shadow-md shadow-brand-500/20"
                    >
                      정답 확인
                    </button>

                    <button
                      type="button"
                      onClick={handleNext}
                      className="px-4 py-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold text-xs"
                    >
                      다음 문제 ➔
                    </button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* MODE 3: TABLE / LIST VIEW */}
          {filteredCards.length > 0 && viewMode === 'list' && (
            <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 dark:bg-slate-800/60 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                    <tr>
                      <th className="py-3 px-4 font-semibold">상태</th>
                      <th className="py-3 px-4 font-semibold">한국어 의도 / 상황</th>
                      <th className="py-3 px-4 font-semibold">원어민 영어 표현</th>
                      <th className="py-3 px-4 font-semibold">예문</th>
                      <th className="py-3 px-4 font-semibold text-right">동작</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filteredCards.map(c => (
                      <tr key={c.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                        <td className="py-3 px-4">
                          <button
                            onClick={() => toggleMemorized(c.id)}
                            className={`p-1.5 rounded-lg text-xs font-bold ${
                              c.memorized ? 'text-emerald-500 bg-emerald-50 dark:bg-emerald-950/40' : 'text-slate-400 bg-slate-100 dark:bg-slate-800'
                            }`}
                          >
                            <Icon name="check" />
                          </button>
                        </td>
                        <td className="py-3 px-4 font-medium text-slate-800 dark:text-slate-200 max-w-xs">
                          {c.front}
                        </td>
                        <td className="py-3 px-4 font-bold text-brand-600 dark:text-brand-400 max-w-xs">
                          <div className="flex items-center gap-1.5">
                            <span>{c.back}</span>
                            <button
                              onClick={() => playTTS(c.back)}
                              className="text-slate-400 hover:text-brand-500"
                              title="발음 듣기"
                            >
                              <Icon name="volume2" />
                            </button>
                          </div>
                        </td>
                        <td className="py-3 px-4 text-slate-500 dark:text-slate-400 italic max-w-sm">
                          {c.example || "-"}
                        </td>
                        <td className="py-3 px-4 text-right">
                          <button
                            onClick={() => deleteCard(c.id)}
                            className="p-1.5 text-slate-400 hover:text-rose-500 transition-colors"
                            title="삭제"
                          >
                            <Icon name="trash" />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- TAB 3: HISTORY & STREAK DASHBOARD ---
    function HistoryTab({ history, setHistory, flashcards, streakData, setStreakData, showToast }) {
      const [expandedSessionId, setExpandedSessionId] = useState(null);
      const fileInputRef = useRef(null);

      // Total speaking minutes estimate (each session ~ 1 min)
      const totalMinutes = history.length;
      const totalWordsSaved = flashcards.length;

      // Copy Single Session to Markdown
      const copySessionMarkdown = (session) => {
        let md = `# 🎙️ 1-Minute English Monologue | ${session.date.slice(0, 10)}\n\n`;
        md += `- **🎯 주제**: ${session.topic}\n`;
        md += `- **🗣️ 내 원문**: "${session.rawText}"\n`;
        if (session.feedback) {
          md += `- **💡 의도 요약**: ${session.feedback.intent_summary}\n`;
          md += `- **Natural Casual**: ${session.feedback.casual_rewriting}\n`;
          md += `- **Professional Business**: ${session.feedback.business_rewriting}\n`;
        }
        navigator.clipboard.writeText(md);
        showToast("마크다운이 클립보드에 복사되었습니다!", "info");
      };

      // Download Single Session as .md File
      const downloadSessionMarkdown = (session) => {
        let md = `# 🎙️ 1-Minute English Monologue | ${session.date.slice(0, 10)}\n\n`;
        md += `- **🎯 주제**: ${session.topic}\n`;
        md += `- **🗣️ 내 원문**: "${session.rawText}"\n`;
        if (session.feedback) {
          md += `- **💡 의도 요약**: ${session.feedback.intent_summary}\n`;
          md += `- **Natural Casual**: ${session.feedback.casual_rewriting}\n`;
          md += `- **Professional Business**: ${session.feedback.business_rewriting}\n`;
        }
        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `monologue-${session.date.slice(0, 10)}.md`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // Export Full JSON Backup
      const handleExportJSON = () => {
        const fullBackup = {
          version: '1.0',
          exportedAt: new Date().toISOString(),
          streakData,
          history,
          flashcards
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `1-minute-monologue-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("데이터 백업 파일이 다운로드되었습니다.", "success");
      };

      // Import JSON Backup
      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.history) setHistory(data.history);
            if (data.flashcards) Storage.set('monologue_flashcards', data.flashcards);
            if (data.streakData) setStreakData(data.streakData);
            showToast("백업 데이터가 성공적으로 복원되었습니다!", "success");
            setTimeout(() => window.location.reload(), 1000);
          } catch (err) {
            alert("유효한 백업 JSON 파일이 아닙니다.");
          }
        };
        reader.readAsText(file);
      };

      // Delete a session
      const deleteSession = (id) => {
        if (!confirm("이 세션 기록을 삭제할까요?")) return;
        setHistory(prev => prev.filter(s => s.id !== id));
        showToast("세션 기록이 삭제되었습니다.", "info");
      };

      const daysOfWeek = ["월", "화", "수", "목", "금", "토", "일"];

      return (
        <div className="space-y-6">
          {/* STATS OVERVIEW CARDS */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-500 flex items-center justify-center">
                <Icon name="flame" />
              </div>
              <div>
                <div className="text-xs text-slate-500">연속 학습 스트릭</div>
                <div className="text-lg font-bold text-slate-900 dark:text-white">
                  {streakData.count}일 연속
                </div>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-brand-100 dark:bg-brand-950/60 text-brand-500 flex items-center justify-center">
                <Icon name="mic" />
              </div>
              <div>
                <div className="text-xs text-slate-500">총 스피킹 세션</div>
                <div className="text-lg font-bold text-slate-900 dark:text-white">
                  {history.length}회 완료
                </div>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-500 flex items-center justify-center">
                <Icon name="bookOpen" />
              </div>
              <div>
                <div className="text-xs text-slate-500">축적된 플래시카드</div>
                <div className="text-lg font-bold text-slate-900 dark:text-white">
                  {totalWordsSaved}개 어휘
                </div>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 shadow-sm flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-950/60 text-blue-500 flex items-center justify-center">
                <Icon name="award" />
              </div>
              <div>
                <div className="text-xs text-slate-500">누적 발화 시간</div>
                <div className="text-lg font-bold text-slate-900 dark:text-white">
                  약 {totalMinutes}분
                </div>
              </div>
            </div>
          </div>

          {/* WEEKLY ACTIVITY GRASS (잔디) */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-3">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <span>🌱 이번 주 스피킹 출석 잔디</span>
              </h3>
              <span className="text-xs text-slate-400">매일 1분씩 꾸준함이 기적을 만듭니다</span>
            </div>

            <div className="grid grid-cols-7 gap-2 pt-2">
              {daysOfWeek.map((dayName, idx) => {
                const isActive = (streakData.activeDays || []).includes(idx);
                return (
                  <div
                    key={idx}
                    className={`flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${
                      isActive
                        ? 'bg-emerald-500 text-white border-emerald-600 shadow-sm shadow-emerald-500/20'
                        : 'bg-slate-50 dark:bg-slate-800/40 text-slate-400 border-slate-200 dark:border-slate-800'
                    }`}
                  >
                    <span className="text-xs font-semibold">{dayName}</span>
                    <span className="mt-1 text-xs">
                      {isActive ? '🔥 1분' : '—'}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* SESSION HISTORY LIST */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <Icon name="calendar" />
                <span>일자별 스피킹 세션 히스토리</span>
                <span className="text-xs font-normal text-slate-400">({history.length}건)</span>
              </h3>

              {/* Data Backup & Restore Action Buttons */}
              <div className="flex items-center gap-2">
                <input
                  type="file"
                  ref={fileInputRef}
                  onChange={handleImportJSON}
                  accept=".json"
                  className="hidden"
                />

                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                  title="백업 JSON 파일 복원"
                >
                  <Icon name="upload" />
                  <span>데이터 복원</span>
                </button>

                <button
                  onClick={handleExportJSON}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-medium text-slate-700 dark:text-slate-200 transition-colors"
                  title="전체 데이터 JSON 다운로드"
                >
                  <Icon name="download" />
                  <span>백업 다운로드</span>
                </button>
              </div>
            </div>

            {history.length === 0 ? (
              <div className="py-12 text-center text-xs text-slate-400">
                아직 완료된 스피킹 기록이 없습니다. 오늘 첫 번째 1분 혼잣말을 시작해보세요!
              </div>
            ) : (
              <div className="space-y-3">
                {history.map(session => {
                  const isExpanded = expandedSessionId === session.id;
                  const dateDisplay = new Date(session.date).toLocaleString('ko-KR', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                  });

                  return (
                    <div
                      key={session.id}
                      className="rounded-xl border border-slate-200/80 dark:border-slate-800 overflow-hidden bg-slate-50/50 dark:bg-slate-850/50 transition-all"
                    >
                      {/* Accordion Header */}
                      <div
                        onClick={() => setExpandedSessionId(isExpanded ? null : session.id)}
                        className="p-4 flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-100/50 dark:hover:bg-slate-800/40 select-none"
                      >
                        <div className="space-y-1 flex-1">
                          <div className="flex items-center gap-2">
                            <span className="text-[11px] font-semibold text-brand-600 dark:text-brand-400">
                              {session.category || "일반"}
                            </span>
                            <span className="text-xs text-slate-400">•</span>
                            <span className="text-xs text-slate-400">{dateDisplay}</span>
                          </div>
                          <h4 className="text-sm font-bold text-slate-800 dark:text-white">
                            "{session.topic}"
                          </h4>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              copySessionMarkdown(session);
                            }}
                            className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700"
                            title="마크다운 복사"
                          >
                            <Icon name="copy" />
                          </button>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              downloadSessionMarkdown(session);
                            }}
                            className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700"
                            title=".md 파일 다운로드"
                          >
                            <Icon name="download" />
                          </button>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              deleteSession(session.id);
                            }}
                            className="p-1.5 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40"
                            title="삭제"
                          >
                            <Icon name="trash" />
                          </button>
                          <span className="text-xs font-bold text-slate-400">
                            {isExpanded ? '▲' : '▼'}
                          </span>
                        </div>
                      </div>

                      {/* Accordion Expanded Body */}
                      {isExpanded && (
                        <div className="p-4 pt-2 border-t border-slate-200/60 dark:border-slate-800 space-y-3 bg-white dark:bg-slate-900 text-xs">
                          {/* Raw Speech */}
                          <div>
                            <span className="font-bold text-slate-500">내 발화 원문:</span>
                            <p className="mt-1 p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-mono">
                              "{session.rawText}"
                            </p>
                          </div>

                          {session.feedback && (
                            <>
                              {/* Rewritings */}
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                                <div className="p-3 rounded-lg bg-emerald-50/50 dark:bg-emerald-950/20 border border-emerald-200/50 dark:border-emerald-900/30">
                                  <div className="flex items-center justify-between font-bold text-emerald-800 dark:text-emerald-300 mb-1">
                                    <span>Natural Casual</span>
                                    <button onClick={() => playTTS(session.feedback.casual_rewriting)}>
                                      <Icon name="volume2" />
                                    </button>
                                  </div>
                                  <p className="font-semibold text-slate-900 dark:text-white">
                                    "{session.feedback.casual_rewriting}"
                                  </p>
                                  <p className="text-slate-500 dark:text-slate-400 mt-1">
                                    {session.feedback.casual_korean}
                                  </p>
                                </div>

                                <div className="p-3 rounded-lg bg-blue-50/50 dark:bg-blue-950/20 border border-blue-200/50 dark:border-blue-900/30">
                                  <div className="flex items-center justify-between font-bold text-blue-800 dark:text-blue-300 mb-1">
                                    <span>Professional Business</span>
                                    <button onClick={() => playTTS(session.feedback.business_rewriting)}>
                                      <Icon name="volume2" />
                                    </button>
                                  </div>
                                  <p className="font-semibold text-slate-900 dark:text-white">
                                    "{session.feedback.business_rewriting}"
                                  </p>
                                  <p className="text-slate-500 dark:text-slate-400 mt-1">
                                    {session.feedback.business_korean}
                                  </p>
                                </div>
                              </div>
                            </>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- SETTINGS MODAL COMPONENT ---
    function SettingsModal({ settings, onSave, onClose }) {
      const [provider, setProvider] = useState(settings.provider);
      const [geminiKey, setGeminiKey] = useState(settings.geminiKey || '');
      const [openaiKey, setOpenaiKey] = useState(settings.openaiKey || '');
      const [showKey, setShowKey] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          ...settings,
          provider,
          geminiKey: geminiKey.trim(),
          openaiKey: openaiKey.trim()
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-5">
            <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
              <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <Icon name="settings" />
                <span>AI 첨삭 엔진 & API Key 설정</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-sm font-bold">
                ✕
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              {/* Provider Selection */}
              <div className="space-y-2">
                <label className="font-semibold text-slate-700 dark:text-slate-300">
                  AI Provider 선택
                </label>
                <div className="grid grid-cols-3 gap-2">
                  <button
                    type="button"
                    onClick={() => setProvider('gemini')}
                    className={`p-2.5 rounded-xl border text-center transition-all ${
                      provider === 'gemini'
                        ? 'border-brand-500 bg-brand-50/50 dark:bg-brand-950/40 text-brand-600 font-bold'
                        : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                    }`}
                  >
                    Google Gemini
                  </button>

                  <button
                    type="button"
                    onClick={() => setProvider('openai')}
                    className={`p-2.5 rounded-xl border text-center transition-all ${
                      provider === 'openai'
                        ? 'border-brand-500 bg-brand-50/50 dark:bg-brand-950/40 text-brand-600 font-bold'
                        : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                    }`}
                  >
                    OpenAI GPT
                  </button>

                  <button
                    type="button"
                    onClick={() => setProvider('demo')}
                    className={`p-2.5 rounded-xl border text-center transition-all ${
                      provider === 'demo'
                        ? 'border-amber-500 bg-amber-50/50 dark:bg-amber-950/40 text-amber-600 font-bold'
                        : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                    }`}
                  >
                    데모 모드 (키 없음)
                  </button>
                </div>
              </div>

              {/* Gemini Key Input */}
              {provider === 'gemini' && (
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="font-semibold text-slate-700 dark:text-slate-300">
                      Google Gemini API Key
                    </label>
                    <a
                      href="https://aistudio.google.com/app/apikey"
                      target="_blank"
                      rel="noreferrer"
                      className="text-brand-500 hover:underline text-[11px]"
                    >
                      무료 키 발급 ➔
                    </a>
                  </div>
                  <div className="relative">
                    <input
                      type={showKey ? "text" : "password"}
                      value={geminiKey}
                      onChange={(e) => setGeminiKey(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white font-mono focus:ring-2 focus:ring-brand-500"
                    />
                    <button
                      type="button"
                      onClick={() => setShowKey(!showKey)}
                      className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-[11px]"
                    >
                      {showKey ? "숨기기" : "보기"}
                    </button>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    API Key는 서버로 전송되지 않고 브라우저의 localStorage에만 안전하게 저장됩니다.
                  </p>
                </div>
              )}

              {/* OpenAI Key Input */}
              {provider === 'openai' && (
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="font-semibold text-slate-700 dark:text-slate-300">
                      OpenAI API Key
                    </label>
                    <a
                      href="https://platform.openai.com/api-keys"
                      target="_blank"
                      rel="noreferrer"
                      className="text-brand-500 hover:underline text-[11px]"
                    >
                      OpenAI 키 관리 ➔
                    </a>
                  </div>
                  <div className="relative">
                    <input
                      type={showKey ? "text" : "password"}
                      value={openaiKey}
                      onChange={(e) => setOpenaiKey(e.target.value)}
                      placeholder="sk-proj-..."
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white font-mono focus:ring-2 focus:ring-brand-500"
                    />
                    <button
                      type="button"
                      onClick={() => setShowKey(!showKey)}
                      className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-[11px]"
                    >
                      {showKey ? "숨기기" : "보기"}
                    </button>
                  </div>
                </div>
              )}

              {/* Demo Mode Notice */}
              {provider === 'demo' && (
                <div className="p-3.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200/80 dark:border-amber-900/60 text-amber-800 dark:text-amber-300 space-y-1">
                  <div className="font-bold">💡 데모 모드 안내</div>
                  <p className="text-[11px] leading-relaxed">
                    API Key 없이도 1분 스피킹, 음성 인식, 3단계 원어민 첨삭 리포트 및 플래시카드 기능을 구조 확인용 실감 나는 Mock 데이터로 무제한 무료 테스트하실 수 있습니다.
                  </p>
                </div>
              )}

              <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100"
                >
                  취소
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold shadow-md shadow-brand-500/20"
                >
                  설정 저장
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render the App into the root DOM element
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
